spring.datasource.url=jdbc:h2:mem:ecommerce;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# The production Flyway scripts use MySQL-specific DDL; build the test schema
# from JPA mappings so the H2 context smoke test does not execute MySQL syntax.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false
app.jwt.secret=test-jwt-secret-key-that-is-at-least-32-bytes-long
app.jwt.expiration-ms=3600000
app.bootstrap-admin.email=admin@ecommerce.test
app.bootstrap-admin.password=admin-test-password
