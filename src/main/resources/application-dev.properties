# Local-only settings. Production deployments must not activate the dev profile.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clotherwebsite?serverTimezone=UTC&sslMode=DISABLED}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

app.bootstrap-admin.email=${ADMIN_EMAIL:admin@local}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap.demo-data.enabled=${BOOTSTRAP_DEMO_DATA:true}
app.bootstrap-demo-user.email=${DEMO_USER_EMAIL:user@local}
app.bootstrap-demo-user.password=${DEMO_USER_PASSWORD:123456}
