spring.application.name=clotherwebsite
server.port=${PORT:8082}

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5199}

# Configure local MySQL credentials through environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate auto-creates and updates database tables; Flyway is disabled.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.jakarta.persistence.lock.timeout=5000
spring.flyway.enabled=false

# Supply unique secrets through environment variables before starting the app.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Local development seed account. Override both values through environment variables when needed.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

# Demo data is disabled by default; seeders are restricted to the dev profile.
app.bootstrap.demo-data.enabled=${BOOTSTRAP_DEMO_DATA:false}
app.bootstrap-demo-user.email=${DEMO_USER_EMAIL:}
app.bootstrap-demo-user.password=${DEMO_USER_PASSWORD:}
