spring.application.name=clotherwebsite
server.port=${PORT:8082}

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5199}

# Configure local MySQL credentials through environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/clotherwebsite?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate auto-creates and updates database tables; Flyway is disabled.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Supply unique secrets through environment variables before starting the app.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Local development seed account. Override both values through environment variables when needed.
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@local}
app.bootstrap-admin.password=${ADMIN_PASSWORD:123456}

# Fills missing demo catalog and sample customer/order rows without resetting existing data.
# Set BOOTSTRAP_DEMO_DATA=false after seeding a live TiDB database.
app.bootstrap.demo-data.enabled=${BOOTSTRAP_DEMO_DATA:true}
app.bootstrap-demo-user.email=${DEMO_USER_EMAIL:user@local}
app.bootstrap-demo-user.password=${DEMO_USER_PASSWORD:123456}
